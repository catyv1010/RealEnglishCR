<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B6FFC"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
  </defs>

  <!-- ICONO: globo terraqueo con un libro abierto en la base.
       Los meridianos llevan trazo 1.6 y opacidad 0.85 (antes 1.5 y 0.6):
       con los valores viejos, al reducir el logo en el header las lineas
       desaparecian y el globo se veia como un circulo plano. -->
  <g transform="translate(6,5)">
    <circle cx="24" cy="24" r="23" fill="url(#g1)"/>

    <g fill="none" stroke="#FFFFFF" stroke-width="1.6" opacity="0.85">
      <ellipse cx="24" cy="24" rx="9.5" ry="23"/>
      <line x1="1" y1="24" x2="47" y2="24"/>
      <path d="M 5 13.5 Q 24 19.5 43 13.5"/>
      <path d="M 5 34.5 Q 24 28.5 43 34.5"/>
    </g>

    <!-- Libro abierto: las dos paginas -->
    <g transform="translate(0,27)">
      <path d="M 24 13 C 19 9 11.5 9 6.5 11 L 6.5 18 C 11.5 16 19 16 24 19 Z" fill