<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B6FFC"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <!-- Icono: globo terraqueo + libro -->
  <g transform="translate(8,8)">
    <!-- Circulo (globo) -->
    <circle cx="22" cy="22" r="20" fill="url(#g1)"/>
    <!-- Lineas del globo -->
    <ellipse cx="22" cy="22" rx="20" ry="8" fill="none" stroke="white" stroke-width="1.5" opacity="0.6"/>
    <line x1="2" y1="22" x2="42" y2="22" stroke="white" stroke-width="1.5" opacity="0.6"/>
    <line x1="22" y1="2" x2="22" y2="42" stroke="white" stroke-width="1.5" opacity="0.6"/>
    <!-- Letra E en el centro -->
    <text x="22" y="29" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="white">E</text>
  </g>

  <!-- Texto: "Real English" + "CR" en otra linea -->
  <text x="58" y="28" font-family="DM Sans, sans-serif" font-size="18" font-weight="700" fill="#1a1a3e">Real English</text>
  <text x="58" y="46" font-family="DM Sans, sans-serif" font-size="11" font-weight="500" fill="#5B6FFC" letter-spacing="2">COSTA RICA</text>
</svg>
