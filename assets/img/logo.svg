<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B6FFC"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
  </defs>

  <!-- ICONO: globo terraqueo con un libro abierto en la base.
       Los meridianos llevan trazo 1.6 y opacidad 0.85 (antes 1.5 y 0.6):
       con los valores viejos, al reducir el logo en el header las lineas
       desaparecian y el globo se veia como un circulo plano. -->
  <g transform="translate(6,5)">
    <circle cx="24" cy="24" r="23" fill="url(#g1)"/>

    <g fill="none" stroke="#FFFFFF" stroke-width="1.6" opacity="0.85">
      <ellipse cx="24" cy="24" rx="9.5" ry="23"/>
      <line x1="1" y1="24" x2="47" y2="24"/>
      <path d="M 5 13.5 Q 24 19.5 43 13.5"/>
      <path d="M 5 34.5 Q 24 28.5 43 34.5"/>
    </g>

    <!-- Libro abierto: las dos paginas -->
    <g transform="translate(0,27)">
      <path d="M 24 13 C 19 9 11.5 9 6.5 11 L 6.5 18 C 11.5 16 19 16 24 19 Z" fill="#FFFFFF"/>
      <path d="M 24 13 C 29 9 36.5 9 41.5 11 L 41.5 18 C 36.5 16 29 16 24 19 Z" fill="#EEF0FF"/>
      <line x1="24" y1="13" x2="24" y2="19" stroke="#5B6FFC" stroke-width="1.3"/>
    </g>
  </g>

  <!-- TEXTO -->
  <text x="66" y="29" font-family="Poppins, DM Sans, Segoe UI, Arial, sans-serif"
        font-size="21" font-weight="700" fill="#0B104A">Real English</text>
  <text x="67" y="44" font-family="Poppins, DM Sans, Segoe UI, Arial, sans-serif"
        font-size="10" font-weight="600" letter-spacing="3.2" fill="#5B6FFC">COSTA RICA</text>

  <!-- Subrayado calido -->
  <rect x="67" y="48" width="44" height="2.6" rx="1.3" fill="url(#g2)"/>
</svg>
